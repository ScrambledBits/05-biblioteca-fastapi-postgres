[project]
name = "biblioteca"
version = "1.0.0"
description = "API REST educativa de una biblioteca con FastAPI y PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]
